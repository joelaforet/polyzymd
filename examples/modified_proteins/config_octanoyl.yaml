# Ubiquitin with an octanoyl amide on Lys63 (the product of NHS-octanoate acylation),
# on Sage 2.3.0 with NAGL charges, in TIP3P water with 0.15 M NaCl. Lys63 is
# deprotonated first: the step is written out, PolyzyMD makes no hidden choice.
name: "ubiquitin_octanoyl"
engine: "openmm"
description: "Ubiquitin with an octanoyl amide on Lys63"

solutes:
  - type: protein
    name: "ubq_octanoyl"
    pdb_path: "structures/ubiquitin.pdb"
    force_field: ["ff14sb_off_impropers_0.0.4.offxml"]
    charges: {method: library}
    modifications:
      - deprotonate: {site: A:K63, atom_name: NZ}
      - attach:
          type: generic
          site: A:K63
          atom_name: NZ
          fragment: {smiles: "*C(=O)CCCCCCC", resname: OC8}   # '*' bonds to NZ
    modification_parameters:
      generic:
        force_field: ["openff-2.3.0.offxml"]
        charges: {method: nagl, model: "openff-gnn-am1bcc-1.0.0.pt"}

solvent:
  force_field: ["openff-2.3.0.offxml"]
  water:
    model: "tip3p"
  ions:
    neutralize: true
    nacl_concentration: 0.15
  box:
    padding: 1.0
    shape: "rhombic_dodecahedron"

thermodynamics:
  temperature: 300.0
  pressure: 1.0

simulation_phases:
  equilibration_stages:
    - name: "equil"
      duration: 0.1
      samples: 10
      ensemble: "NVT"
      temperature: 300.0
  production:
    ensemble: "NPT"
    duration: 0.1
    samples: 10
    time_step: 2.0
    thermostat: "LangevinMiddle"
    barostat: "MC"

openmm:
  platform: "CUDA"

output:
  projects_directory: "."
  naming_template: "{enzyme}_{temperature}K_run{replicate}"
