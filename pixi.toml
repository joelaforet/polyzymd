# =============================================================================
# PolyzyMD — pixi.toml
# =============================================================================
#
# ENVIRONMENTS
# ------------
#   build           — system preparation, package development, docs, local checks
#   analysis        — trajectory analysis, comparison, and plotting
#   test            — local and CI test environment
#   sim-cuda-12-0   — CUDA 12.0 Blanca simulation runtime, OpenMM 8.1.2
#   sim-cuda-12-4   — CUDA 12.4 Blanca simulation runtime, OpenMM 8.1.2
#   sim-cuda-12-6   — CUDA 12.6 simulation runtime, current OpenMM stack
#
# WORKFLOW SPLIT
# --------------
# PolyzyMD intentionally separates system preparation, GPU simulation, and
# analysis environments. CUDA 12.4 cluster nodes need an OpenMM build that is
# not compatible with the Python 3.12 / NumPy 2 analysis stack, so simulation
# environments are lean runtime environments and do not inherit analysis tools.
#
# HOW TO FIND YOUR CUDA VERSION
# ------------------------------
# Run on a GPU node:  nvidia-smi | head -1
# The driver version in the top-right maps to a maximum CUDA version.
# Use the simulation environment whose cuda-version does not exceed your driver.
#
# Known clusters:
#   PSC Bridges2       → sim-cuda-12-6
#   CU Boulder Blanca  → sim-cuda-12-4
#
# FIRST-TIME CLUSTER SETUP
# ------------------------
# - Install pixi:  curl -fsSL https://pixi.sh/install.sh | sh
# - Clone the repo and cd into it
# - Run: pixi install -e build -e sim-cuda-12-4
# - Submit from build; the Slurm job activates the simulation environment
#
# Local setup and analysis should use `build` or `analysis`, not a sim-cuda env.
# =============================================================================

[workspace]
name        = "polyzymd"
version     = "1.3.0"
description = "MD simulations for enzyme-polymer systems"
channels    = ["conda-forge"]
requires-pixi = ">=0.72.2"
platforms = [
  "linux-64",
  "osx-64",
  "osx-arm64",
  { name = "blanca-cuda-12-0", platform = "linux-64", cuda = { driver = "12.0", arch = "8.0" } },
  { name = "blanca-cuda-12-4", platform = "linux-64", cuda = { driver = "12.4", arch = "8.6" } },
  { name = "cuda-12-6", platform = "linux-64", cuda = { driver = "12.6", arch = "8.0" } },
]


# =============================================================================
# FEATURE: core
# Lightweight package runtime shared by all environments. Keep this free of
# NumPy pins so each solve group can select the stack it needs.
# =============================================================================
[feature.core.dependencies]
python             = "3.12.*"
pydantic           = ">=2.5"
pyyaml             = ">=6.0"
click              = ">=8.1"
click-option-group = ">=0.5"
jinja2             = ">=3.1"
packaging          = ">=23.0"
tqdm               = ">=4.60"
biopandas          = ">=0.4"

[feature.core.pypi-dependencies]
polyzymd = { path = ".", editable = true }


# =============================================================================
# FEATURE: numpy2
# Current analysis/package stack for Python 3.12 work.
# =============================================================================
[feature.numpy2.dependencies]
numpy = ">=2.0,<3"
scipy = ">=1.13"


# =============================================================================
# FEATURE: numpy1-sim
# CUDA 12.4 simulation runtime stack. OpenMM 8.1.x CUDA 12.4 builds require a
# NumPy 1.x ABI, so this feature must never be mixed with numpy2.
# =============================================================================
[feature.numpy1-sim.dependencies]
numpy = ">=1.26,<2"
scipy = ">=1.13,<1.14"


# =============================================================================
# FEATURE: analysis
# Trajectory analysis, plotting, and statistics. Use with numpy2 solve groups.
# =============================================================================
[feature.analysis.dependencies]
mdanalysis   = ">=2.8"
mdtraj       = ">=1.10"
scikit-learn = ">=1.4"
pandas       = ">=2.2"
matplotlib   = ">=3.8"
seaborn      = ">=0.13"


# =============================================================================
# FEATURE: builder
# Molecular preparation stack used for PDB/OpenFF/polymer system construction.
# =============================================================================
[feature.builder.dependencies]
openff-toolkit        = ">=0.16"
openff-interchange    = ">=0.5"
openff-packmol        = ">=0.1"
openff-units          = ">=0.2"
openff-forcefields    = ">=2024.0"
smirnoff99frosst      = ">=1.1"
openff-amber-ff-ports = ">=2024.0"
openff-nagl           = ">=0.4"
openff-nagl-models    = ">=2024.0"
mbuild                = ">=1.2"
openbabel             = ">=3.1"
rdkit                 = ">=2023.09"
pdbfixer              = ">=1.9"
packmol               = ">=20.0"
pytorch               = "2.6.*"

[feature.builder.pypi-dependencies]
polymerist = ">=1.1.0"
# NOTE: espaloma-charge is intentionally excluded. polymerist eagerly imports
# it at module level (_toolkits.py), which triggers a broken dgl -> graphbolt
# import chain that crashes when dgl and PyTorch versions are mismatched.
# PolyzyMD uses NAGL (not espaloma) for charge assignment; NAGL >=0.2 has a
# pure-PyTorch fallback that works without dgl. Users who need espaloma can
# install it manually: pip install espaloma-charge


# =============================================================================
# FEATURE: openmm-any
# Flexible non-CUDA OpenMM for local build/test workflows.
# =============================================================================
[feature.openmm-any.dependencies]
openmm = ">=8.4,<8.5"


# =============================================================================
# FEATURE: dev-tools
# Test, lint, type-check, and documentation toolchains.
# =============================================================================
[feature.dev-tools.dependencies]
pytest           = ">=9.0.2,<10"
pytest-cov       = ">=4.0"
black            = ">=23.0"
ruff             = ">=0.1"
mypy             = ">=1.0"
pre-commit       = ">=3.0"
sphinx           = ">=6.0"
sphinx-rtd-theme = ">=1.0"
myst-parser      = ">=1.0"
sphinx-copybutton = ">=0.5"
sphinx-design    = ">=0.5"
sphinx-click     = ">=4.0"
autodoc-pydantic = ">=2.1"


# =============================================================================
# FEATURE: package-build
# Build and release validation tools for Python distributions.
# =============================================================================
[feature.package-build.dependencies]
python-build = ">=1.2"
twine        = ">=5.0"


# =============================================================================
# FEATURE: sim-cuda-12-6
# CUDA 12.6 simulation runtime — e.g. PSC Bridges2.
# =============================================================================
[feature.sim-cuda-12-6]
platforms = ["cuda-12-6"]

[feature.sim-cuda-12-6.target.cuda-12-6.dependencies]
numpy        = ">=2.0,<3"
scipy        = ">=1.13"
openmm       = ">=8.4,<8.5"
cuda-version = "=12.6"

# =============================================================================
# FEATURE: sim-cuda-12-0
# CUDA 12.0 simulation runtime for older Blanca driver cohorts.
# =============================================================================
[feature.sim-cuda-12-0]
platforms = ["blanca-cuda-12-0"]

[feature.sim-cuda-12-0.target.blanca-cuda-12-0.dependencies]
openmm       = "=8.1.2"
cuda-version = "=12.0"


# =============================================================================
# FEATURE: sim-cuda-12-4
# CUDA 12.4 simulation runtime — e.g. CU Boulder Blanca. This environment uses
# an older OpenMM/NumPy stack because CUDA 12.4 cluster GPUs cannot solve with
# the current NumPy 2 analysis stack.
# =============================================================================
[feature.sim-cuda-12-4]
platforms = ["blanca-cuda-12-4"]

[feature.sim-cuda-12-4.target.blanca-cuda-12-4.dependencies]
openmm       = "=8.1.2"
cuda-version = "=12.4"


# =============================================================================
# ENVIRONMENTS
# Separate solve groups keep the NumPy 2 analysis/package stack isolated from
# the legacy CUDA 12.4 simulation stack.
# =============================================================================
[environments]
build = { features = ["core", "numpy2", "builder", "analysis", "openmm-any", "dev-tools", "package-build"], no-default-feature = true, solve-group = "numpy2" }
analysis = { features = ["core", "numpy2", "analysis"], no-default-feature = true, solve-group = "numpy2" }
test = { features = ["core", "numpy2", "builder", "analysis", "openmm-any", "dev-tools"], no-default-feature = true, solve-group = "numpy2" }
sim-cuda-12-4 = { features = ["core", "numpy1-sim", "sim-cuda-12-4"], no-default-feature = true, solve-group = "sim-cuda-12-4" }
sim-cuda-12-0 = { features = ["core", "numpy1-sim", "sim-cuda-12-0"], no-default-feature = true, solve-group = "sim-cuda-12-0" }
sim-cuda-12-6 = { features = ["core", "sim-cuda-12-6"], no-default-feature = true, solve-group = "sim-cuda-12-6" }


# =============================================================================
# TASKS
# =============================================================================

# --- Build environment tasks (no CUDA needed) ---
[feature.openmm-any.tasks]
build     = { cmd = "polyzymd build" }
validate  = { cmd = "polyzymd validate" }
init      = { cmd = "polyzymd init" }
info      = { cmd = "polyzymd info" }
clean-pdb = { cmd = "polyzymd clean-pdb" }

# --- Analysis environment tasks ---
[feature.analysis.tasks]
compare-validate = { cmd = "polyzymd compare validate" }
compare-run      = { cmd = "polyzymd compare run" }
compare-plot-all = { cmd = "polyzymd compare plot-all" }

# --- CUDA 12.6 simulation tasks (e.g. PSC Bridges2) ---
[feature.sim-cuda-12-6.tasks]
submit         = { cmd = "polyzymd submit", description = "Submit SLURM jobs (CUDA 12.6)" }
run-segment    = { cmd = "polyzymd run-segment", description = "Run next simulation segment" }
run-openmm     = { cmd = "polyzymd run --engine openmm", description = "Run local OpenMM simulation" }
recover        = { cmd = "polyzymd recover", description = "Resume stalled simulation" }
check-progress = { cmd = "polyzymd check-progress", description = "Check simulation progress" }

# --- CUDA 12.4 simulation tasks (e.g. CU Boulder Blanca) ---
[feature.sim-cuda-12-4.tasks]
submit         = { cmd = "polyzymd submit", description = "Submit SLURM jobs (CUDA 12.4)" }
run-segment    = { cmd = "polyzymd run-segment", description = "Run next simulation segment" }
run-openmm     = { cmd = "polyzymd run --engine openmm", description = "Run local OpenMM simulation" }
recover        = { cmd = "polyzymd recover", description = "Resume stalled simulation" }
check-progress = { cmd = "polyzymd check-progress", description = "Check simulation progress" }

[feature.sim-cuda-12-0.tasks]
submit         = { cmd = "polyzymd submit", description = "Submit SLURM jobs (CUDA 12.0)" }
run-segment    = { cmd = "polyzymd run-segment", description = "Run next simulation segment" }
run-openmm     = { cmd = "polyzymd run --engine openmm", description = "Run local OpenMM simulation" }
recover        = { cmd = "polyzymd recover", description = "Resume stalled simulation" }
check-progress = { cmd = "polyzymd check-progress", description = "Check simulation progress" }
