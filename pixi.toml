# =============================================================================
# PolyzyMD — pixi.toml
# =============================================================================
#
# ENVIRONMENTS
# ------------
#   build       — structure building, PDB prep, local use (Python 3.11; Polymerist)
#   pablo       — OpenFF Pablo ingestion experiments (Python >=3.12; no Polymerist)
#   conjugation-py312 — Polymerist + OpenFF Pablo experiment (Python 3.12; no EspalomaCharge)
#   cuda-12-4   — CUDA 12.4 driver (e.g. CU Boulder Blanca): OpenMM 8.1
#   cuda-12-6   — CUDA 12.6 driver (e.g. PSC Bridges2):      OpenMM 8.4
#
# HOW TO FIND YOUR CUDA VERSION
# ------------------------------
# Run on a GPU node:  nvidia-smi | head -1
# The driver version in the top-right maps to a maximum CUDA version.
# Use the environment whose cuda-version does not exceed your driver.
#
# Known clusters:
#   PSC Bridges2       → cuda-12-6
#   CU Boulder Blanca  → cuda-12-4
#
# Adding support for a new cluster: file a PR adding a new feature block
# following the pattern of [feature.cuda-12-4] below, and add the
# corresponding environment and tasks.
#
# FIRST-TIME CLUSTER SETUP
# ------------------------
# 1. Install pixi:  curl -fsSL https://pixi.sh/install.sh | sh
# 2. Clone the repo and cd into it
# 3. Run: pixi install -e cuda-12-6   (or whichever matches your cluster)
# 4. Run: pixi shell -e cuda-12-6
#
# After `pixi shell`, the `polyzymd` binary is on PATH and works exactly
# as before — no `pixi run` prefix needed.
#
# LOCAL (no cluster) — use the "build" environment:
#   pixi install -e build
#   pixi shell -e build
#   polyzymd build ...     ✓
#   polyzymd validate ...  ✓
#   polyzymd clean-pdb ... ✓
#   polyzymd submit ...    ✗  (requires a cuda-* environment)
# =============================================================================

[workspace]
name        = "polyzymd"
version     = "1.2.1"
description = "MD simulations for enzyme-polymer systems"
channels    = ["conda-forge"]
platforms   = ["linux-64", "osx-arm64"]


# =============================================================================
# FEATURE: base
# Packages shared by ALL environments. Only packages that polyzymd actually
# imports (directly or transitively).
# =============================================================================
[feature.base.dependencies]
python              = "3.11.*"
numpy               = "1.26.*"       # pinned: OpenMM ABI-sensitive
pydantic            = ">=2.5"
pyyaml              = ">=6.0"
click               = ">=8.1"
packaging           = ">=23.0"       # conditional import in polyzymd

# OpenFF stack — solver resolves compatible set
openff-toolkit      = ">=0.16"
openff-interchange  = ">=0.5"
openff-packmol      = ">=0.1"        # new home of Interchange's Packmol wrapper
openff-units        = ">=0.2"
openff-forcefields  = ">=2024.0"     # data package for ForceField()
smirnoff99frosst    = ">=1.1"        # data package for ForceField()
openff-amber-ff-ports = ">=2024.0"   # data package for ForceField()

# Charge assignment (lazy import in polyzymd)
openff-nagl         = ">=0.4"
openff-nagl-models  = ">=2024.0"

# Molecular building
mbuild              = ">=1.2"        # required by polymerist
openbabel           = ">=3.1"        # required at import time by polymerist.polymers.building
rdkit               = ">=2023.09"
pdbfixer            = ">=1.9"        # conditional import in polyzymd
packmol             = ">=20.0"       # called as subprocess by mbuild/polymerist
ambertools          = ">=23.3"        # relaxed: 23.3 lacks py311 on osx-arm64

# PyTorch (required by openff-nagl)
pytorch             = "2.6.*"
pytest = ">=9.0.2,<10"
pytest-cov = ">=4.0"
black = ">=23.0"
ruff = ">=0.1"

# Analysis stack (MDAnalysis, plotting, stats)
mdanalysis          = ">=2.4"
mdtraj              = ">=1.9"
scikit-learn        = ">=1.0"
pandas              = ">=2.0"
matplotlib          = ">=3.5"
seaborn             = ">=0.12"

# Documentation toolchain
sphinx              = ">=6.0"
sphinx-rtd-theme    = ">=1.0"
myst-parser         = ">=1.0"
sphinx-copybutton   = ">=0.5"
sphinx-design       = ">=0.5"
sphinx-click        = ">=4.0"
autodoc-pydantic    = ">=2.1"

[feature.base.pypi-dependencies]
polyzymd            = { path = ".", editable = true }
polymerist          = ">=1.0.1"
# NOTE: espaloma-charge is intentionally excluded. polymerist eagerly imports
# it at module level (_toolkits.py), which triggers a broken dgl -> graphbolt
# import chain that crashes when dgl and PyTorch versions are mismatched.
# polyzymd uses NAGL (not espaloma) for charge assignment; NAGL >=0.2 has a
# pure-PyTorch fallback that works without dgl. Users who need espaloma can
# install it manually: pip install espaloma-charge


# =============================================================================
# FEATURE: openmm-any
# For the "build" environment — flexible OpenMM, no CUDA pin.
# Suitable for local use: PDB writing, system building, validation.
# =============================================================================
[feature.openmm-any.dependencies]
openmm = ">=8.1,<8.5"


# =============================================================================
# FEATURE: pablo
# OpenFF Pablo is currently distributed from GitHub and requires Python >=3.12.
# Keep this in its own environment because Polymerist is currently limited to
# Python 3.11 in practice. Do not combine this feature with feature.base unless
# Polymerist and Pablo support the same Python version range.
# =============================================================================
[feature.pablo.dependencies]
python              = ">=3.12,<3.13"
numpy               = "1.26.*"
pydantic            = ">=2.5"
pyyaml              = ">=6.0"
click               = ">=8.1"
packaging           = ">=23.0"
pytest              = ">=9.0.2,<10"
openff-toolkit-base = ">=0.17.1"
rustworkx           = ">=0.14"
pyxdg               = ">=0.28"
gemmi               = ">=0.6"

[feature.pablo.pypi-dependencies]
polyzymd = { path = ".", editable = true }
openff-pablo = { git = "https://github.com/openforcefield/openff-pablo.git", tag = "v0.2.2" }


# =============================================================================
# FEATURE: conjugation-py312
# Targeted Python 3.12 experiment for the conjugation builder stack.
#
# PolyzyMD intentionally does NOT support EspalomaCharge in this environment:
# espaloma-charge pulls the DGL/Torch/GraphBolt stack, which has been fragile on
# Python 3.12 and can break imports before PolyzyMD gets to its own NAGL charge
# path. Keep espaloma-charge / espaloma_charge / dgl out of direct dependencies;
# if dgl appears, it should only be as a transitive solver result that must be
# diagnosed before promoting this environment.
#
# Polymerist currently imports the private importlib.resources._common.get_package
# helper removed in Python 3.12. PolyzyMD ships a temporary lazy shim in
# builders.conjugation.polymerist_compat so Polymerist can still be imported in
# this experiment until upstream switches to public importlib.resources APIs.
#
# setuptools<82 is required because gmso/mbuild still import pkg_resources at
# runtime. Removing this pin will break Polymerist's dependency stack until those
# imports are replaced upstream.
#
# In this parallel worktree, use `PYTHONNOUSERSITE=1 pixi run -e conjugation-py312 ...`
# if user-site editable installs from another worktree shadow this checkout.
# =============================================================================
[feature.conjugation-py312.dependencies]
python              = ">=3.12,<3.13"
numpy               = "1.26.*"
pydantic            = ">=2.5"
pyyaml              = ">=6.0"
click               = ">=8.1"
packaging           = ">=23.0"
pytest              = ">=9.0.2,<10"
ruff                = ">=0.14"
setuptools          = "<82.0.0"       # gmso/mbuild still import pkg_resources
rustworkx           = ">=0.14"        # OpenFF Pablo runtime dependency
pyxdg               = ">=0.28"        # OpenFF Pablo CCD cache dependency
gemmi               = ">=0.6"         # OpenFF Pablo mmCIF/PDBx parsing dependency

# OpenFF stack — conda-forge only for compiled/runtime chemistry packages.
openff-toolkit      = ">=0.17.1"
openff-interchange  = ">=0.5"
openff-units        = ">=0.2"
openff-forcefields  = ">=2024.0"
openff-amber-ff-ports = ">=2024.0"
openff-nagl         = ">=0.5"
openff-nagl-models  = ">=2025.0"
pytorch             = ">=2.6,<2.9"

# Polymer/conjugation and simulation stack.
mbuild              = ">=1.2"
openbabel           = ">=3.1"
rdkit               = ">=2023.09"
pdbfixer            = ">=1.9"
packmol             = ">=20.0"
ambertools          = ">=23.3"
openmm              = ">=8.1,<8.5"

[feature.conjugation-py312.pypi-dependencies]
polyzymd = { path = ".", editable = true }
polymerist = ">=1.0.1"
openff-pablo = { git = "https://github.com/openforcefield/openff-pablo.git", tag = "v0.2.2" }


# =============================================================================
# FEATURE: cuda-12-6
# CUDA 12.6 driver — e.g. PSC Bridges2 (V100, sm_70)
# OpenMM 8.4 is the tested version for this CUDA/GPU combination.
# =============================================================================
[feature.cuda-12-6.dependencies]
openmm       = "=8.4.0"
cuda-version = "=12.6"

[feature.cuda-12-6.system-requirements]
cuda = "12.6"


# =============================================================================
# FEATURE: cuda-12-4
# CUDA 12.4 driver — e.g. CU Boulder Blanca
# OpenMM 8.1 is the tested version for this CUDA/GPU combination.
# =============================================================================
[feature.cuda-12-4.dependencies]
openmm       = "=8.1.2"
cuda-version = "=12.4"

[feature.cuda-12-4.system-requirements]
cuda = "12.4"


# =============================================================================
# FEATURE: conjugation-poc
# Additional dependencies for the conjugation proof-of-concept notebook
# (src/polyzymd/builders/conjugation/poc/).
# Uses the "build" (openmm-any) base + pins CUDA <=13.0 so the runtime
# libraries match the local GPU driver (RTX 2000 Ada, driver 580.126.09).
# =============================================================================
[feature.conjugation-poc.dependencies]
scipy        = ">=1.10"
marimo       = ">=0.20"
cuda-version = "<=13.0"

[feature.conjugation-poc.system-requirements]
cuda = "13.0"

[feature.conjugation-poc.pypi-dependencies]
py3dmol = ">=2.0"

[feature.conjugation-poc.tasks]
conjugation-poc = { cmd = "marimo edit src/polyzymd/builders/conjugation/poc/conjugation_poc.py", description = "Open the conjugation POC notebook" }
conjugation-sim = { cmd = "python src/polyzymd/builders/conjugation/poc/run_conjugate_simulation.py", description = "Run the full conjugation simulation workflow" }


# =============================================================================
# ENVIRONMENTS
# Each environment = base feature + one OpenMM/CUDA feature.
# no-default-feature = true  prevents the default feature from polluting
# GPU environments with unrelated deps.
# =============================================================================
[environments]
build           = { features = ["base", "openmm-any"], no-default-feature = true, solve-group = "build" }
pablo           = { features = ["pablo"], no-default-feature = true, solve-group = "pablo" }
conjugation-py312 = { features = ["conjugation-py312"], no-default-feature = true, solve-group = "conjugation-py312" }
cuda-12-6       = { features = ["base", "cuda-12-6"], no-default-feature = true, solve-group = "cuda-12-6" }
cuda-12-4       = { features = ["base", "cuda-12-4"], no-default-feature = true, solve-group = "cuda-12-4" }
conjugation-poc = { features = ["base", "openmm-any", "conjugation-poc"], no-default-feature = true, solve-group = "conjugation-poc" }


# =============================================================================
# TASKS
# `pixi run <task>` — environment is selected automatically.
# After `pixi shell`, these are also available as bare `polyzymd` commands.
# =============================================================================

# --- build environment tasks (no CUDA needed) ---
[feature.openmm-any.tasks]
build         = { cmd = "polyzymd build" }
validate      = { cmd = "polyzymd validate" }
init          = { cmd = "polyzymd init" }
info          = { cmd = "polyzymd info" }
clean-pdb     = { cmd = "polyzymd clean-pdb" }

# --- CUDA 12.6 simulation tasks (e.g. PSC Bridges2) ---
[feature.cuda-12-6.tasks]
submit         = { cmd = "polyzymd submit",         description = "Submit SLURM jobs (OpenMM 8.4, CUDA 12.6)" }
run-segment    = { cmd = "polyzymd run-segment",    description = "Run next simulation segment" }
run            = { cmd = "polyzymd run --engine gromacs", description = "Run local simulation (select engine)" }
recover        = { cmd = "polyzymd recover",         description = "Resume stalled simulation" }
check-progress = { cmd = "polyzymd check-progress", description = "Check simulation progress" }

# --- CUDA 12.4 simulation tasks (e.g. CU Boulder Blanca) ---
[feature.cuda-12-4.tasks]
submit         = { cmd = "polyzymd submit",         description = "Submit SLURM jobs (OpenMM 8.1, CUDA 12.4)" }
run-segment    = { cmd = "polyzymd run-segment",    description = "Run next simulation segment" }
run            = { cmd = "polyzymd run --engine gromacs", description = "Run local simulation (select engine)" }
recover        = { cmd = "polyzymd recover",         description = "Resume stalled simulation" }
check-progress = { cmd = "polyzymd check-progress", description = "Check simulation progress" }
