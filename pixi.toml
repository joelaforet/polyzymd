# =============================================================================
# PolyzyMD — pixi.toml
# =============================================================================
#
# ENVIRONMENTS
# ------------
#   build       — structure building, PDB prep, local use (no CUDA required)
#   cuda-12-4   — CUDA 12.4 driver (e.g. CU Boulder Blanca): OpenMM 8.1
#   cuda-12-6   — CUDA 12.6 driver (e.g. PSC Bridges2):      OpenMM 8.4
#
# HOW TO FIND YOUR CUDA VERSION
# ------------------------------
# Run on a GPU node:  nvidia-smi | head -1
# The driver version in the top-right maps to a maximum CUDA version.
# Use the environment whose cuda-version does not exceed your driver.
#
# Known clusters:
#   PSC Bridges2       → cuda-12-6
#   CU Boulder Blanca  → cuda-12-4
#
# Adding support for a new cluster: file a PR adding a new feature block
# following the pattern of [feature.cuda-12-4] below, and add the
# corresponding environment and tasks.
#
# FIRST-TIME CLUSTER SETUP
# ------------------------
# 1. Install pixi:  curl -fsSL https://pixi.sh/install.sh | sh
# 2. Clone the repo and cd into it
# 3. Run: pixi install -e cuda-12-6   (or whichever matches your cluster)
# 4. Run: pixi shell -e cuda-12-6
#
# After `pixi shell`, the `polyzymd` binary is on PATH and works exactly
# as before — no `pixi run` prefix needed.
#
# LOCAL (no cluster) — use the "build" environment:
#   pixi install -e build
#   pixi shell -e build
#   polyzymd build ...     ✓
#   polyzymd validate ...  ✓
#   polyzymd clean-pdb ... ✓
#   polyzymd submit ...    ✗  (requires a cuda-* environment)
# =============================================================================

[workspace]
name        = "polyzymd"
version     = "1.2.1"
description = "MD simulations for enzyme-polymer systems"
channels    = ["conda-forge"]
platforms   = ["linux-64", "osx-arm64"]


# =============================================================================
# FEATURE: base
# Packages shared by ALL environments. Only packages that polyzymd actually
# imports (directly or transitively).
# =============================================================================
[feature.base.dependencies]
python              = "3.11.*"
numpy               = "1.26.*"       # pinned: OpenMM ABI-sensitive
pydantic            = ">=2.5"
pyyaml              = ">=6.0"
click               = ">=8.1"
jinja2              = ">=3.1"
packaging           = ">=23.0"       # conditional import in polyzymd

# OpenFF stack — solver resolves compatible set
openff-toolkit      = ">=0.16"
openff-interchange  = ">=0.5"
openff-packmol      = ">=0.1"        # new home of Interchange's Packmol wrapper
openff-units        = ">=0.2"
openff-forcefields  = ">=2024.0"     # data package for ForceField()
smirnoff99frosst    = ">=1.1"        # data package for ForceField()
openff-amber-ff-ports = ">=2024.0"   # data package for ForceField()

# Charge assignment (lazy import in polyzymd)
openff-nagl         = ">=0.4"
openff-nagl-models  = ">=2024.0"

# Molecular building
mbuild              = ">=1.2"        # required by polymerist
openbabel           = ">=3.1"        # required at import time by polymerist.polymers.building
rdkit               = ">=2023.09"
pdbfixer            = ">=1.9"        # conditional import in polyzymd
packmol             = ">=20.0"       # called as subprocess by mbuild/polymerist
ambertools          = ">=23.3"        # relaxed: 23.3 lacks py311 on osx-arm64

# PyTorch (required by openff-nagl)
pytorch             = "2.6.*"
pytest = ">=9.0.2,<10"
pytest-cov = ">=4.0"
black = ">=23.0"
ruff = ">=0.1"

# Analysis stack (MDAnalysis, plotting, stats)
mdanalysis          = ">=2.4"
mdtraj              = ">=1.9"
scikit-learn        = ">=1.0"
pandas              = ">=2.0"
matplotlib          = ">=3.5"
seaborn             = ">=0.12"

# Documentation toolchain
sphinx              = ">=6.0"
sphinx-rtd-theme    = ">=1.0"
myst-parser         = ">=1.0"
sphinx-copybutton   = ">=0.5"
sphinx-design       = ">=0.5"
sphinx-click        = ">=4.0"
autodoc-pydantic    = ">=2.1"

[feature.base.pypi-dependencies]
polyzymd            = { path = ".", editable = true }
polymerist          = ">=1.0.1"
# NOTE: espaloma-charge is intentionally excluded. polymerist eagerly imports
# it at module level (_toolkits.py), which triggers a broken dgl -> graphbolt
# import chain that crashes when dgl and PyTorch versions are mismatched.
# polyzymd uses NAGL (not espaloma) for charge assignment; NAGL >=0.2 has a
# pure-PyTorch fallback that works without dgl. Users who need espaloma can
# install it manually: pip install espaloma-charge


# =============================================================================
# FEATURE: openmm-any
# For the "build" environment — flexible OpenMM, no CUDA pin.
# Suitable for local use: PDB writing, system building, validation.
# =============================================================================
[feature.openmm-any.dependencies]
openmm = ">=8.1,<8.5"


# =============================================================================
# FEATURE: cuda-12-6
# CUDA 12.6 driver — e.g. PSC Bridges2 (V100, sm_70)
# OpenMM 8.4 is the tested version for this CUDA/GPU combination.
# =============================================================================
[feature.cuda-12-6.dependencies]
openmm       = "=8.4.0"
cuda-version = "=12.6"

[feature.cuda-12-6.system-requirements]
cuda = "12.6"


# =============================================================================
# FEATURE: cuda-12-4
# CUDA 12.4 driver — e.g. CU Boulder Blanca
# OpenMM 8.1 is the tested version for this CUDA/GPU combination.
# =============================================================================
[feature.cuda-12-4.dependencies]
openmm       = "=8.1.2"
cuda-version = "=12.4"

[feature.cuda-12-4.system-requirements]
cuda = "12.4"


# =============================================================================
# ENVIRONMENTS
# Each environment = base feature + one OpenMM/CUDA feature.
# no-default-feature = true  prevents the default feature from polluting
# GPU environments with unrelated deps.
# =============================================================================
[environments]
build     = { features = ["base", "openmm-any"], no-default-feature = true, solve-group = "build" }
cuda-12-6 = { features = ["base", "cuda-12-6"], no-default-feature = true, solve-group = "cuda-12-6" }
cuda-12-4 = { features = ["base", "cuda-12-4"], no-default-feature = true, solve-group = "cuda-12-4" }


# =============================================================================
# TASKS
# `pixi run <task>` — environment is selected automatically.
# After `pixi shell`, these are also available as bare `polyzymd` commands.
# =============================================================================

# --- build environment tasks (no CUDA needed) ---
[feature.openmm-any.tasks]
build         = { cmd = "polyzymd build" }
validate      = { cmd = "polyzymd validate" }
init          = { cmd = "polyzymd init" }
info          = { cmd = "polyzymd info" }
clean-pdb     = { cmd = "polyzymd clean-pdb" }

# --- CUDA 12.6 simulation tasks (e.g. PSC Bridges2) ---
[feature.cuda-12-6.tasks]
submit         = { cmd = "polyzymd submit",         description = "Submit SLURM jobs (OpenMM 8.4, CUDA 12.6)" }
run-segment    = { cmd = "polyzymd run-segment",    description = "Run next simulation segment" }
run            = { cmd = "polyzymd run --engine gromacs", description = "Run local simulation (select engine)" }
recover        = { cmd = "polyzymd recover",         description = "Resume stalled simulation" }
check-progress = { cmd = "polyzymd check-progress", description = "Check simulation progress" }

# --- CUDA 12.4 simulation tasks (e.g. CU Boulder Blanca) ---
[feature.cuda-12-4.tasks]
submit         = { cmd = "polyzymd submit",         description = "Submit SLURM jobs (OpenMM 8.1, CUDA 12.4)" }
run-segment    = { cmd = "polyzymd run-segment",    description = "Run next simulation segment" }
run            = { cmd = "polyzymd run --engine gromacs", description = "Run local simulation (select engine)" }
recover        = { cmd = "polyzymd recover",         description = "Resume stalled simulation" }
check-progress = { cmd = "polyzymd check-progress", description = "Check simulation progress" }
