name: polyzymd-env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip

  # Testing
  - pytest
  - pytest-cov

  # Core simulation stack (must be conda)
  - openmm>=8.4,<8.5
  - openff-toolkit>=0.16
  - openff-interchange>=0.5
  - openff-nagl>=0.4
  - openff-nagl-models
  - openff-forcefields
  - openff-units
  # AmberTools 24.8 is Linux-focused/default tested for legacy AM1-BCC workflows.
  # macOS users should prefer pixi build without AmberTools unless a dedicated
  # macOS AM1-BCC environment is designed.
  - ambertools=24.8
  - rdkit>=2023.09

  # Molecule building (must be conda)
  - mbuild
  - openbabel
  - packmol

  # MD trajectory analysis
  - mdanalysis>=2.8
  - mdtraj>=1.10

  # Numerical/utility (conda)
  - numpy>=2.0,<3
  - scipy>=1.13
  - pandas>=2.2
  - scikit-learn>=1.4
  - matplotlib>=3.8
  - seaborn>=0.13
  - networkx
  - pydantic>=2.0
  - pyyaml
  - click
  - tqdm
  - anytree

  # Pip-only packages
  - pip:
    - polymerist>=1.1.0
    - biopandas
