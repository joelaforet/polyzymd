<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 800" role="img" aria-labelledby="t d">
  <title id="t">Run lifecycle and restart chain</title>
  <desc id="d">A replicate runs minimization, equilibration stages and production segments; on SLURM each job checks for STOP, runs the next piece with run-segment, checks progress and submits itself again until production is complete; progress.json records each segment and each completed equilibration stage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#1f2933"/>
    </marker>
  </defs>
  <rect width="1184" height="800" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <!-- ===================== OpenMM lane ===================== -->
    <rect x="24" y="24" width="1136" height="480" rx="6" fill="#ffffff" stroke="#2f6fdf" stroke-width="1.5"/>
    <text x="40" y="52" font-size="16" font-weight="bold" fill="#1f2933">OpenMM</text>

    <!-- job brackets -->
    <g stroke="#9aa5b1" stroke-width="1.5" fill="none">
      <polyline points="48,96 48,88 672,88 672,96"/>
      <polyline points="752,96 752,88 896,88 896,96"/>
      <polyline points="976,96 976,88 1120,88 1120,96"/>
    </g>
    <g font-size="12" fill="#52606d" text-anchor="middle">
      <text x="360" y="80">SLURM job 1</text>
      <text x="824" y="80">job 2</text>
      <text x="1048" y="80">job N</text>
    </g>

    <!-- what runs -->
    <rect x="48" y="104" width="128" height="64" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="64" y="130" font-size="14" font-weight="bold" fill="#1f2933">Minimize</text>
    <text x="64" y="152" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">minimization/</text>

    <rect x="256" y="104" width="168" height="64" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="272" y="130" font-size="14" font-weight="bold" fill="#1f2933">Equilibration</text>
    <text x="272" y="152" font-size="12" fill="#52606d">one folder per stage</text>

    <rect x="504" y="104" width="168" height="64" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="520" y="130" font-size="14" font-weight="bold" fill="#1f2933">Production 0</text>
    <text x="520" y="152" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">production_0/</text>

    <rect x="752" y="104" width="144" height="64" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="768" y="130" font-size="14" font-weight="bold" fill="#1f2933">Segment 1</text>
    <text x="768" y="152" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">production_1/</text>

    <rect x="976" y="104" width="144" height="64" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="992" y="130" font-size="14" font-weight="bold" fill="#1f2933">Segment N</text>
    <text x="992" y="152" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">production_N/</text>

    <g stroke="#1f2933" stroke-width="1.5" fill="none">
      <line x1="176" y1="136" x2="256" y2="136" marker-end="url(#arrow)"/>
      <line x1="424" y1="136" x2="504" y2="136" marker-end="url(#arrow)"/>
      <line x1="672" y1="136" x2="752" y2="136" marker-end="url(#arrow)"/>
      <line x1="896" y1="136" x2="976" y2="136" marker-end="url(#arrow)"/>
    </g>
    <g font-size="12" fill="#52606d" text-anchor="middle">
      <text x="216" y="128">continues</text>
      <text x="464" y="128">continues</text>
      <text x="712" y="128">resumes</text>
      <text x="936" y="128">resumes</text>
    </g>

    <!-- progress.json -->
    <rect x="256" y="208" width="864" height="40" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="272" y="233" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">progress.json</text>
    <text x="400" y="233" font-size="12" fill="#52606d">segments: RUNNING → COMPLETED / INTERRUPTED / FAILED; stages when completed; seeds; SHA-256</text>
    <g stroke="#1f2933" stroke-width="1.5" fill="none">
      <line x1="340" y1="168" x2="340" y2="208" marker-end="url(#arrow)"/>
      <line x1="588" y1="168" x2="588" y2="208" marker-end="url(#arrow)"/>
      <line x1="824" y1="168" x2="824" y2="208" marker-end="url(#arrow)"/>
      <line x1="1048" y1="168" x2="1048" y2="208" marker-end="url(#arrow)"/>
    </g>
    <g font-size="12" fill="#52606d">
      <text x="348" y="193">writes</text>
      <text x="596" y="193">writes</text>
      <text x="832" y="193">writes</text>
      <text x="1056" y="193">writes</text>
    </g>

    <!-- job script loop -->
    <text x="48" y="282" font-size="14" font-weight="bold" fill="#1f2933">Inside each job</text>

    <rect x="48" y="320" width="152" height="64" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="64" y="346" font-size="14" font-weight="bold" fill="#1f2933">STOP file?</text>
    <text x="64" y="368" font-size="12" fill="#52606d">written by cancel</text>

    <rect x="328" y="320" width="160" height="64" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="344" y="346" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">run-segment</text>
    <text x="344" y="368" font-size="12" fill="#52606d">next piece of work</text>

    <rect x="616" y="320" width="160" height="64" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="632" y="346" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">check-progress</text>
    <text x="632" y="368" font-size="12" fill="#52606d">work left?</text>

    <rect x="904" y="320" width="160" height="64" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="920" y="346" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">sbatch itself</text>
    <text x="920" y="368" font-size="12" fill="#52606d">afterany dependency</text>

    <g stroke="#1f2933" stroke-width="1.5" fill="none">
      <line x1="200" y1="352" x2="328" y2="352" marker-end="url(#arrow)"/>
      <line x1="488" y1="352" x2="616" y2="352" marker-end="url(#arrow)"/>
      <line x1="776" y1="352" x2="904" y2="352" marker-end="url(#arrow)"/>
      <polyline points="1064,352 1112,352 1112,296 124,296 124,320" marker-end="url(#arrow)"/>
    </g>
    <g font-size="12" fill="#52606d" text-anchor="middle">
      <text x="264" y="344">no STOP</text>
      <text x="552" y="344">exit 0 or 99</text>
      <text x="552" y="372">99 = state saved</text>
      <text x="840" y="344">exit 1</text>
      <text x="840" y="372">work remains</text>
      <text x="616" y="288">resubmits: the next job starts here</text>
    </g>

    <!-- exits -->
    <rect x="48" y="448" width="728" height="32" rx="6" fill="#f0f2f4" stroke="#9aa5b1" stroke-width="1.5"/>
    <text x="412" y="469" font-size="14" fill="#1f2933" text-anchor="middle">chain ends: no successor</text>
    <g stroke="#1f2933" stroke-width="1.5" fill="none">
      <line x1="124" y1="384" x2="124" y2="448" marker-end="url(#arrow)"/>
      <line x1="408" y1="384" x2="408" y2="448" marker-end="url(#arrow)"/>
      <line x1="656" y1="384" x2="656" y2="448" marker-end="url(#arrow)"/>
      <line x1="744" y1="384" x2="744" y2="448" marker-end="url(#arrow)"/>
    </g>
    <g font-size="12" fill="#52606d">
      <text x="132" y="420">STOP present</text>
      <text x="416" y="420">exit 2 or error</text>
      <text x="648" y="420" text-anchor="end">exit 0: done</text>
      <text x="752" y="420">exit 3: error</text>
    </g>

    <!-- ===================== GROMACS lane ===================== -->
    <rect x="24" y="528" width="1136" height="248" rx="6" fill="#ffffff" stroke="#c05621" stroke-width="1.5"/>
    <text x="40" y="556" font-size="16" font-weight="bold" fill="#1f2933">GROMACS</text>

    <rect x="48" y="592" width="112" height="64" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="64" y="618" font-size="14" font-weight="bold" fill="#1f2933">EM</text>
    <text x="64" y="640" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">em</text>

    <rect x="240" y="592" width="128" height="64" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="256" y="618" font-size="14" font-weight="bold" fill="#1f2933">Equilibrate</text>
    <text x="256" y="640" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">eq_NN</text>

    <rect x="448" y="592" width="192" height="64" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="464" y="618" font-size="14" font-weight="bold" fill="#1f2933">Production</text>
    <text x="464" y="640" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">-cpi -append -maxh</text>

    <rect x="720" y="592" width="224" height="64" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="736" y="618" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">_update-gromacs-progress</text>
    <text x="736" y="640" font-size="12" fill="#52606d">writes gromacs/progress.json</text>

    <rect x="1008" y="568" width="136" height="56" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="1024" y="592" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">trjconv</text>
    <text x="1024" y="612" font-size="12" fill="#52606d">nojump + centre</text>

    <rect x="1008" y="672" width="136" height="56" rx="6" fill="#f5f7fa" stroke="#1f2933" stroke-width="1.5"/>
    <text x="1024" y="696" font-size="13" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">sbatch itself</text>
    <text x="1024" y="716" font-size="12" fill="#52606d">next job</text>

    <g stroke="#1f2933" stroke-width="1.5" fill="none">
      <line x1="160" y1="624" x2="240" y2="624" marker-end="url(#arrow)"/>
      <line x1="368" y1="624" x2="448" y2="624" marker-end="url(#arrow)"/>
      <line x1="640" y1="624" x2="720" y2="624" marker-end="url(#arrow)"/>
      <line x1="944" y1="612" x2="1008" y2="596" marker-end="url(#arrow)"/>
      <line x1="944" y1="636" x2="1008" y2="700" marker-end="url(#arrow)"/>
      <polyline points="1076,728 1076,752 544,752 544,656" marker-end="url(#arrow)"/>
    </g>
    <g font-size="12" fill="#52606d">
      <text x="200" y="616" text-anchor="middle">continues</text>
      <text x="408" y="616" text-anchor="middle">continues</text>
      <text x="680" y="616" text-anchor="middle">reports</text>
      <text x="952" y="588">finished</text>
      <text x="976" y="708" text-anchor="end">not finished</text>
      <text x="810" y="744" text-anchor="middle">resubmits: production resumes from state.cpt</text>
    </g>
  </g>
</svg>
