[build-system]
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "polyzymd"
version = "1.3.0"
description = "Molecular dynamics simulation toolkit for enzyme-polymer systems"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Joseph R. Laforet Jr.", email = "jola3134@colorado.edu" }
]
keywords = [
    "molecular-dynamics",
    "enzyme",
    "polymer",
    "openmm",
    "openff",
    "simulation",
    "gromacs",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.12"

# =============================================================================
# Core Dependencies
# =============================================================================
# NOTE: polyzymd is intended to be installed via pixi for full functionality.
# The dependencies below are the lightweight pip-installable runtime subset.
# The analysis extra provides a best-effort pip path for analysis workflows.
# The full simulation, CUDA, OpenFF, OpenMM, AmberTools, RDKit, and PACKMOL
# stack is supported and recommended through pixi/conda-forge environments.
#
# Recommended installation:
#   git clone <repo> && cd polyzymd
#   pixi install -e build          # system preparation and package work
#   pixi install -e analysis       # trajectory analysis and plotting
#   pixi install -e sim-cuda-12-0  # CUDA 12.0 simulation runtime
#   pixi install -e sim-cuda-12-4  # CUDA 12.4 simulation runtime
#   # Scheduled OpenMM jobs normally use --pixi-env auto.
# =============================================================================
dependencies = [
    # Configuration and CLI (these install cleanly via pip)
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "click-option-group>=0.5.0",
    "jinja2>=3.1",
    
    # Utilities (these install cleanly via pip)
    "numpy>=1.26,<3",
    "tqdm>=4.60.0",
    
    # Analysis
    "biopandas>=0.4.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Best-effort pip analysis workflows; pixi remains recommended for full science stack
analysis = [
    "mdanalysis>=2.8.0",
    "mdtraj>=1.10.0",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

# Polymer building (polymerist integration)
polymers = [
    "polymerist>=1.1.0",
    "networkx>=3.0",
    "anytree>=2.8.0",
]

# Development tools
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

# Documentation
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=1.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-design>=0.5.0",
    "sphinx-click>=4.0.0",
    "autodoc-pydantic>=2.1.0",
]

# Full installation (for development) - still needs conda prereqs
full = [
    "polyzymd[analysis,polymers,dev,docs]",
]

[project.scripts]
polyzymd = "polyzymd.cli.main:main"

[project.urls]
Homepage = "https://github.com/joelaforet/polyzymd"
Documentation = "https://polyzymd.readthedocs.io"
Repository = "https://github.com/joelaforet/polyzymd"
Issues = "https://github.com/joelaforet/polyzymd/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/polyzymd"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "F401",  # unused imports (many are for re-export or TYPE_CHECKING blocks)
    "F841",  # unused variables (sometimes used for debugging/clarity)
    "F821",  # undefined name (false positives from quoted type hints for forward refs)
    "B007",  # unused loop control variable (often intentional for clarity)
    "B904",  # raise without from (would require refactoring)
    "B905",  # zip without strict (legacy code uses implicit truncation)
    "C414",  # unnecessary list() in sorted() (harmless)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
