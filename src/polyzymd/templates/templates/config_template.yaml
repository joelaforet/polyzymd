# ============================================================================
# PolyzyMD Configuration Template
# ============================================================================
#
# INSTRUCTIONS:
# 1. Uncomment the sections you need by removing the leading "# " characters
# 2. Replace placeholder values (protein_X, ligand_Y, etc.) with your data
# 3. Validate your configuration: polyzymd validate -c config.yaml
# 4. Build your system: polyzymd build -c config.yaml -r 1
#
# Documentation: https://polyzymd.readthedocs.io/en/latest/tutorials/quickstart.html
#
# REQUIRED SECTIONS:
#   - name (simulation identifier)
#   - engine (openmm or gromacs)
#   - enzyme (protein structure)
#   - solvent (solvation settings)
#   - thermodynamics (temperature, pressure)
#   - simulation_phases (equilibration, production)
#   - output (directory settings)
#
# OPTIONAL SECTIONS:
#   - substrate (docked ligand)
#   - polymers (co-polymer chains)
#   - restraints (distance restraints)
#   - force_field (custom force fields)
#
# ============================================================================

# Simulation identifier - used in output directory names
name: {{ project_name | yaml_quote }}

# Required simulation engine: "openmm" or "gromacs"
engine: "openmm"

description: "Description of your simulation system"

# ============================================================================
# Build Endpoint (OPTIONAL)
# ============================================================================
# "system" (default): complete solvated simulation inputs
# "solute": parameterized primary covalent component only; preparation handoff
# "structure": assembled conjugate coordinates only; requires conjugation
# A command-line --scope value overrides this setting for one build.
#
# build:
#   scope: "system"

# ============================================================================
# Enzyme Configuration (REQUIRED)
# ============================================================================
# Your protein structure file. Must be:
#   - Standard amino acid residue names (no nonstandard residues)
#   - Properly protonated at your simulation pH
#   - No missing heavy atoms in regions of interest
#
# TIP: Run `polyzymd clean-pdb -i your_protein.pdb` or use another PDB
#      preparation tool before building your system.
#
# enzyme:
#   name: "protein_X"
#   pdb_path: "structures/protein_X.pdb"
#   description: "My enzyme description"

# ============================================================================
# Substrate Configuration (OPTIONAL)
# ============================================================================
# Docked ligand or small molecule substrate.
# Comment out this entire section if not using a substrate.
#
# charge_method options:
#   - "nagl"     : Neural network charges (fast, recommended)
#   - "espaloma" : Graph neural network charges
#   - "am1bcc"   : AM1-BCC charges (slower, traditional)
#
# substrate:
#   name: "ligand_Y"
#   sdf_path: "structures/ligand_Y.sdf"
#   conformer_index: 0                    # Which conformer to use (0 = first)
#   charge_method: "nagl"
#   residue_name: "LIG"                   # 3-letter residue name in output

# ============================================================================
# Polymer Configuration (OPTIONAL)
# ============================================================================
# Random co-polymer chains to add around the enzyme.
# Set to null or comment out if not using polymers.
#
# Two modes are available:
#   MODE A - Pre-built: Supply SDF files of already-parameterized polymers
#   MODE B - Dynamic:   Generate polymers on-the-fly from monomer SMILES
#
# polymers: null
#
# ----------------------------------------------------------------------------
# MODE A: Pre-built polymer SDFs
# ----------------------------------------------------------------------------
# Use this when you already have polymer structure files (e.g., from a
# previous run or external tool). Place SDF files in a directory and
# point sdf_directory to it.
#
# polymers:
#   enabled: true
#   type_prefix: "polymer_A"              # Identifier for polymer type
#   
#   # Monomer composition - probabilities must sum to 1.0
#   monomers:
#     - label: "A"
#       probability: 0.80
#       name: "monomer_1"
#     - label: "B"
#       probability: 0.20
#       name: "monomer_2"
#   
#   length: 10                            # Number of monomers per chain
#   count: 4                              # Number of polymer chains
#   
#   # Directory containing pre-built polymer SDF files
#   sdf_directory: "polymer_sdfs/my_polymer"
#   
#   # Cache directory for generated polymers
#   cache_directory: ".polymer_cache"
#   
#   # Random seed for reproducible polymer sequences (OPTIONAL)
#   # If not set, uses the replicate number as the seed.
#   # Set this to get identical polymer sequences across different replicates.
#   # random_seed: 42
#   
#   # Packing settings for polymers around the protein
#   packing:
#     padding: 2.0                        # nm padding around solute for polymer box
#     tolerance: 2.0                      # PACKMOL tolerance (Angstrom)
#     movebadrandom: false                # set true for dense/heterogeneous polymer systems
#
# ----------------------------------------------------------------------------
# MODE B: Dynamic polymer generation from monomer SMILES (RECOMMENDED)
# ----------------------------------------------------------------------------
# PolyzyMD generates random co-polymers on-the-fly using ATRP methacrylate
# reaction templates that ship with the package. You supply monomer SMILES
# and feed ratios; PolyzyMD handles fragment generation, polymerization,
# charge assignment, and 3D embedding.
#
# polymers:
#   enabled: true
#   generation_mode: "dynamic"            # Key setting: generate from SMILES
#   type_prefix: "<monomer1>-<monomer2>"   # Used in output directory names
#   
#   # Bundled ATRP methacrylate reaction templates
#   # "default" uses the templates that ship with PolyzyMD
#   reactions:
#     initiation: "default"
#     polymerization: "default"
#     termination: "default"
#   
#   # Monomer composition with SMILES strings
#   # Probabilities must sum to 1.0
#   # SMILES must be fully explicit-hydrogen methacrylate monomers
#   monomers:
#     - label: "A"
#       probability: 0.75
#       name: "<monomer_1_name>"
#       smiles: "<monomer_1_SMILES>"
#     - label: "B"
#       probability: 0.25
#       name: "<monomer_2_name>"
#       smiles: "<monomer_2_SMILES>"
#   
#   # Charge assignment for generated polymers
#   charger: "nagl"                       # Options: nagl, espaloma, am1bcc
#   max_retries: 10                       # Retries if ring-piercing occurs
#   
#   length: 10                            # Number of monomers per chain
#   count: 4                              # Number of polymer chains
#   
#   cache_directory: ".polymer_cache"
#   
#   packing:
#     padding: 2.0                        # nm padding around solute
#     tolerance: 2.0                      # PACKMOL tolerance (Angstrom)
#     movebadrandom: false                # set true for dense/heterogeneous systems

# ============================================================================
# Solvent Configuration (REQUIRED)
# ============================================================================
# Water model, ions, and box settings.
#
# water model options: tip3p, spce, tip4pew, opc
# box shape options: orthorhombic, rhombic_dodecahedron, truncated_octahedron
# orthorhombic applies padding independently on both faces of each axis:
#   box length_i = coordinate extent_i + 2 * padding
# Legacy "cube" is accepted as a deprecated alias for orthorhombic; it does
# not force all three box lengths to be equal.
#
# solvent:
#   primary:
#     type: "water"
#     model: "tip3p"
#   
#   # Co-solvents (optional) - leave empty [] if not using
#   co_solvents: []
#   
#   # Co-solvent specification options:
#   #   - mole_fraction: Specify as solvent mole fraction (e.g., 0.10 for 10 mol%)
#   #   - concentration:  Specify as molar (e.g., 2.0 for 2 M)
#   #   NOTE: Use ONE method per co-solvent, not both.
#   #
#   # Built-in co-solvents (auto-populated smiles & density):
#   #   dmso, dmf, acetonitrile, urea, ethanol, methanol, glycerol,
#   #   isopropanol, acetone, thf, dioxane, ethylene_glycol
#   
#   # Example: 10 mol% DMSO (replaces water in neutral solvent mixture)
#   # co_solvents:
#   #   - name: "dmso"
#   #     mole_fraction: 0.10              # Mole fraction
#   
#   # Example: 2 M urea (additive, doesn't reduce water)
#   # co_solvents:
#   #   - name: "urea"
#   #     concentration: 2.0                # Molar
#   
#   # Example: Custom co-solvent (not in library)
#   # co_solvents:
#   #   - name: "my_solvent"
#   #     smiles: "CCOC(=O)C"               # SMILES required for custom
#   #     mole_fraction: 0.05              # Mole fraction
#   
#   ions:
#     neutralize: true                    # Add counter-ions to neutralize
#     nacl_concentration: 0.15            # NaCl-equivalent final ion concentration (M)
#   
#   box:
#     padding: 1.2                        # nm from solute to box edge
#     shape: "rhombic_dodecahedron"       # Efficient packing
#     target_density: 1.0                 # g/mL
#     tolerance: 2.0                      # PACKMOL tolerance (Angstrom)

# ============================================================================
# Restraints (OPTIONAL)
# ============================================================================
# Distance restraints to maintain specific interactions during simulation.
# Useful for keeping substrates in active sites.
#
# Restraint types:
#   - flat_bottom  : No force within threshold, harmonic beyond
#   - harmonic     : Standard harmonic restraint
#   - upper_wall   : Only restrains if distance exceeds threshold
#   - lower_wall   : Only restrains if distance below threshold
#
# Selection syntax:
#   protein         : All protein atoms (use to restrict to protein chain)
#   resid N        : Residue number (1-indexed, matches PDB)
#   resname XXX    : Residue name (e.g., LIG, SER)
#   name XXX       : Atom name (e.g., CA, OG, C1)
#   pdbindex N     : PDB atom serial number (1-indexed, matches PyMOL)
#   index N        : Internal atom index (0-indexed)
#   and/or         : Combine selections
#
# IMPORTANT: Residue numbers restart per chain. For protein residues,
# always use "protein and resid X" to avoid matching polymer/water atoms.
#
# restraints:
#   - type: "flat_bottom"
#     name: "substrate_restraint"
#     atom1:
#       selection: "protein and resid 100 and name OG"   # Example: Serine OG
#       description: "Catalytic residue"
#     atom2:
#       selection: "resname LIG and name C1"  # Example: Ligand carbon
#       description: "Substrate reactive atom"
#     distance: 3.5                           # Angstroms (flat-bottom threshold)
#     force_constant: 10000.0                 # kJ/mol/nm^2
#     enabled: true

# ============================================================================
# Thermodynamics (REQUIRED)
# ============================================================================
# Temperature and pressure settings for the simulation.
#
# thermodynamics:
#   temperature: 300.0                    # Kelvin
#   pressure: 1.0                         # atmospheres

# ============================================================================
# Simulation Phases (REQUIRED)
# ============================================================================
# Configure equilibration and production runs.
#
# ensemble options: NVT, NPT, NVE
# thermostat options: LangevinMiddle (recommended), Langevin, Andersen
# barostat options: MC (Monte Carlo), MCA (anisotropic)
#
# Use staged equilibration for all simulations. This is the only supported
# simulation config path and is the recommended workflow for stable builds.
#
# Use this pattern for protocols with:
#   - Temperature ramping (simulated annealing style heating)
#   - Position restraints on specific atom groups
#   - Staged release of restraints
#
# Available atom groups for position restraints:
#   protein_heavy     : All non-hydrogen protein atoms
#   protein_backbone  : Protein backbone atoms (N, CA, C, O)
#   protein_calpha    : Protein alpha carbons only
#   ligand_heavy      : All non-hydrogen substrate/ligand atoms
#   polymer_heavy     : All non-hydrogen polymer atoms
#   solvent           : All solvent atoms (water + ions + cosolvents)
#   water_only        : Only water molecules
#   ions_only         : Only ions (Na+, Cl-, etc.)
#   cosolvents_only   : Only cosolvent molecules (DMSO, etc.)
#
# Temperature settings:
#   - Use "temperature" for constant temperature
#   - For ramping, set temperature_start, temperature_end,
#     temperature_increment (K), and temperature_interval_steps;
#     PolyzyMD derives the duration
#
# simulation_phases:
#   equilibration_stages:
#     # Stage 1: Heat from 60K to 300K with everything restrained
#     - name: "heating"
#       samples: 50                       # trajectory frames
#       ensemble: "NVT"
#       temperature_start: 60.0           # Start temperature (K)
#       temperature_end: 300.0            # End temperature (K)
#       temperature_increment: 1.0         # Increase per update (K)
#       temperature_interval_steps: 600    # MD steps between updates
#       position_restraints:
#         - group: "protein_heavy"
#           force_constant: 4184.0        # kJ/mol/nm^2 (= 1 kcal/mol/A^2)
#         - group: "polymer_heavy"
#           force_constant: 4184.0
#     # Add a constant-temperature stage after heating to equilibrate at the endpoint.
#     
#     # Stage 2: Relax polymers while keeping protein restrained
#     - name: "polymer_relaxation"
#       duration: 1.0                     # nanoseconds
#       samples: 100
#       ensemble: "NVT"
#       temperature: 300.0                # Constant temperature
#       position_restraints:
#         - group: "protein_heavy"
#           force_constant: 4184.0
#     
#     # Stage 3: Free equilibration (no restraints)
#     - name: "free_equilibration"
#       duration: 0.5                     # nanoseconds
#       samples: 100
#       ensemble: "NPT"
#       temperature: 300.0
#       # No position_restraints = unrestrained
#   
#   production:
#     ensemble: "NPT"
#     duration: 100.0
#     samples: 2500
#     checkpoint_interval: 60.0
#     time_step: 2.0
#     thermostat: "LangevinMiddle"
#     thermostat_timescale: 1.0
#     barostat: "MC"
#     barostat_frequency: 25

# ============================================================================
# Output Configuration (REQUIRED)
# ============================================================================
# Directory structure and file naming.
#
# For HPC systems, you may want separate directories:
#   - projects_directory: long-term storage (scripts, logs)
#   - scratch_directory: high-performance storage (trajectories)
#
# For local development, set both to "." or just projects_directory.
#
# output:
#   projects_directory: "."               # Where to put scripts and logs
#   scratch_directory: null               # Where to put trajectories (null = same as projects)
#   
#   # Subdirectories within projects_directory
#   job_scripts_subdir: "job_scripts"
#   slurm_logs_subdir: "slurm_logs"
#   
#   # Naming template for run directories
#   # Available variables: {enzyme}, {substrate}, {polymer_type}, {duration}, {temperature}, {replicate}
#   # polymer_type format: {type_prefix}_{label1}{pct1}_{label2}{pct2} (e.g., SBMA-EGMA_A75_B25)
#   naming_template: "{enzyme}_{substrate}_{polymer_type}_{duration}ns_{temperature}K_run{replicate}"
#   
#   # Output options
#   save_checkpoint: true
#   save_state_data: true
#   trajectory_format: "dcd"              # Options: dcd, xtc

# ============================================================================
# Force Field Selection (OPTIONAL)
# ============================================================================
# Custom force field files. Defaults are usually fine.
#
# force_field:
#   protein: "ff14sb_off_impropers_0.0.4.offxml"
#   small_molecule: "openff-2.0.0.offxml"
#
# Conjugation moiety force fields are attachment scoped:
#
# conjugation:
#   enabled: true
#   attachments:
#     - name: "asn60_glycan"
#       moiety:
#         name: "n_glycan"
#         force_field: "glycam06"          # Canonical GLYCAM value
#     - name: "lys63_polymer"
#       moiety:
#         name: "polymer"
#         force_field: "openff-2.0.0.offxml" # Explicit OpenFF owner
#
# Unknown moiety.force_field values fail loudly; PolyzyMD does not fall back from
# GLYCAM to OpenFF. Post-overlay restraints may target glycans and other atoms.
# Exact mixed-overlay builds write ownership_manifest.json and
# overlay_diagnostics.json; final OpenMM minimization uses maxIterations=0.
