name: public-api-conjugation-walkthrough
engine: openmm
enzyme:
  name: public-api-protein
  pdb_path: src/polyzymd/builders/conjugation/poc/data/NH3_terminal_His_proton_updated.pdb
thermodynamics:
  temperature: 300.0
  pressure: 1.0
simulation_phases:
  equilibration_stages:
    - name: eq
      duration: 0.001
      samples: 1
      ensemble: NVT
      temperature: 300.0
  production:
    ensemble: NVT
    duration: 0.001
    samples: 1
    time_step: 2.0
    report_interval: 1
    checkpoint_interval: 60
solvent:
  primary:
    type: water
    model: tip3p
  ions:
    neutralize: true
    nacl_concentration: 0.0
  box:
    padding: 0.8
    shape: cube
    tolerance: 2.0
conjugation:
  enabled: true
  attachments:
    - name: lys23-reference-sbma-egpma-nhs
      site:
        chain_id: A
        residue_name: LYS
        residue_number: 23
      moiety:
        name: reference-SBMA-EGPMA-NHS
        recipe:
          name: SBMA-EGPMA-NHS
          length: 10
          seed: 42
          reactive_monomer_label: C
          monomers:
            - label: A
              name: SBMA
              residue_name: SBM
              smiles: "[H]C([H])=C(C(=O)OC([H])([H])C([H])([H])[N+](C([H])([H])[H])(C([H])([H])[H])C([H])([H])C([H])([H])C([H])([H])S(=O)(=O)[O-])C([H])([H])[H]"
              probability: 0.945
            - label: B
              name: EGPMA
              residue_name: EGP
              smiles: "[H]C([H])=C(C(=O)OC([H])([H])C([H])([H])Oc1c([H])c([H])c([H])c([H])c1[H])C([H])([H])[H]"
              probability: 0.045
            - label: C
              name: NHS
              residue_name: NHS
              smiles: "CC(=C)C(=O)ON1C(=O)CCC1=O"
              probability: 0.01
      mechanism:
        name: nhs_lys_amide
