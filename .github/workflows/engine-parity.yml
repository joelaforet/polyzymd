name: Engine parity and physics audit

# The checks that make a PolyzyMD build trustworthy, on every pull request:
# OpenMM and GROMACS exports of one system must hold the same terms, every
# physics check must pass a correct build and fail each way a build has gone
# wrong, and GROMACS must compile the staged position restraints PolyzyMD
# writes. GROMACS comes from Ubuntu, so grompp runs without changing pixi.lock.

on:
  pull_request:
  push:
    branches: [main, dev, "feature/**", "feat/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

jobs:
  parity:
    name: Engine parity and physics audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GROMACS
        run: |
          sudo apt-get update
          sudo apt-get install -y gromacs
          gmx --version | head -n 3

      - uses: prefix-dev/setup-pixi@v0
        with:
          environments: test

      - name: Physics audit, engine parity and GROMACS restraints
        run: |
          pixi run -e test pytest -v --durations=25 --color=yes \
            --cov=polyzymd --cov-report=xml \
            tests/audit \
            tests/exporters/test_gromacs_staged_restraints.py \
            tests/modifying_proteins/test_parameters.py \
            tests/config/test_solutes.py
        env:
          # The Full Test Suite leaves tests/audit to this job on Ubuntu, so
          # this job reports its coverage. The sys.monitoring tracer keeps the
          # cost low on Python 3.12+.
          COVERAGE_CORE: sysmon

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-ubuntu-latest-engine-parity
          fail_ci_if_error: false
