# Queries a PolyzyMD user types into the docs search box, and the pages that
# answer them. `scripts/check_docs_search.py` runs each query through the
# Sphinx search of a built site and reports the rank of the best expected page.
#
# - query: the words as a user would type them.
# - expect: docnames (paths under docs/source, without `.md`) that answer the
#   query; the first is the best answer. A hit at any of them counts.
#
# Add a query when a user could not find a page; keep the expected pages to
# the ones that answer the task, not every page that mentions it.

# Install and first steps
- query: install
  expect: [get_started/installation, get_started/index]
- query: install polyzymd
  expect: [get_started/installation, get_started/index]
- query: quickstart
  expect: [get_started/quickstart]
- query: first simulation
  expect: [get_started/quickstart]
- query: examples
  expect: [get_started/index]

