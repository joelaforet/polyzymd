name: "fast_mixed_e2e_1ubq"
engine: "openmm"
description: "Opt-in fast mixed polymer/glycan conjugation checkpoint for cleaned 1UBQ"

enzyme:
  name: "1UBQ"
  pdb_path: "1ubq.pdb"

polymers:
  enabled: true
  generation_mode: "dynamic"
  type_prefix: "SBMA"
  monomers:
    - label: "A"
      probability: 1.0
      name: "SBMA"
      residue_name: "SBM"
      smiles: "[H]C([H])=C(C(=O)OC([H])([H])C([H])([H])[N+](C([H])([H])[H])(C([H])([H])[H])C([H])([H])C([H])([H])C([H])([H])S(=O)(=O)[O-])C([H])([H])[H]"
  length: 3
  count: 1
  reactions:
    initiation: "default"
    polymerization: "default"
    termination: "default"
  charger: "nagl"
  max_retries: 3
  cache_directory: ".polymer_cache"
  random_seed: 202610
  packing:
    padding: 1.2
    tolerance: 2.0
    movebadrandom: true

conjugation:
  enabled: true
  attachments:
    - name: "abc_lys63_polymer"
      enabled: true
      site:
        chain_id: "A"
        residue_name: "LYS"
        residue_number: 63
        atom_name: "NZ"
      moiety:
        name: "ABC_3mer"
        polymer_recipe:
          name: "SBMA-EGPMA-NHS"
          length: 3
          seed: null
          fixed_sequence: "ACB"
          reactive_monomer_label: "C"
          reactive_monomer_index: 1
          monomers:
            - label: "A"
              name: "SBMA"
              residue_name: "SBM"
              smiles: "[H]C([H])=C(C(=O)OC([H])([H])C([H])([H])[N+](C([H])([H])[H])(C([H])([H])[H])C([H])([H])C([H])([H])C([H])([H])S(=O)(=O)[O-])C([H])([H])[H]"
              probability: 0.945
            - label: "B"
              name: "EGPMA"
              residue_name: "EGP"
              smiles: "[H]C([H])=C(C(=O)OC([H])([H])C([H])([H])Oc1c([H])c([H])c([H])c([H])c1[H])C([H])([H])[H]"
              probability: 0.045
            - label: "C"
              name: "NHS"
              residue_name: "NHS"
              smiles: "CC(=C)C(=O)ON1C(=O)CCC1=O"
              probability: 0.01
      mechanism:
        name: "nhs_lys_amide"
    - name: "asn60_three_branch_nglycan"
      enabled: true
      site:
        chain_id: "A"
        residue_name: "ASN"
        residue_number: 60
        atom_name: "ND2"
      moiety:
        name: "three_branch_nglycan"
        force_field: "glycam06"
        residue_name: "NAG"
        smiles: "CC(=O)N[C@@H]1[C@H]([C@@H]([C@H](O[C@H]1O)CO)O[C@H]2[C@@H]([C@H]([C@@H]([C@H](O2)CO)O[C@H]3[C@H]([C@H]([C@@H]([C@H](O3)CO[C@@H]4[C@H]([C@H]([C@@H]([C@H](O4)CO[C@@H]5[C@H]([C@H]([C@@H]([C@H](O5)CO)O)O)O)O)O[C@@H]6[C@H]([C@H]([C@@H]([C@H](O6)CO)O)O)O[C@@H]7[C@H]([C@H]([C@@H]([C@H](O7)CO)O)O)O)O)O)O[C@@H]8[C@H]([C@H]([C@@H]([C@H](O8)CO)O)O)O[C@@H]9[C@H]([C@H]([C@@H]([C@H](O9)CO)O)O)O[C@@H]1[C@H]([C@H]([C@@H]([C@H](O1)CO)O)O)O)O)O)NC(=O)C)O"
      mechanism:
        name: "n_glycosylation"
  ccd_pablo:
    allow_ccd_lookup: true

solvent:
  primary:
    type: "water"
    model: "tip3p"
  ions:
    neutralize: true
    nacl_concentration: 0.0
  box:
    padding: 1.0
    shape: "cube"
    target_density: 1.0

thermodynamics:
  temperature: 300.0
  pressure: 1.0

simulation_phases:
  equilibration_stages:
    - name: "fast_minimal_heating"
      duration: 0.001
      samples: 1
      ensemble: "NVT"
      temperature: 300.0
  production:
    ensemble: "NPT"
    duration: 0.2
    samples: 100
    report_interval: 1000
    checkpoint_interval: 0.05
    time_step: 2.0
    thermostat: "LangevinMiddle"
    thermostat_timescale: 1.0
    barostat: "MC"
    barostat_frequency: 25

output:
  projects_directory: "."
  scratch_directory: null
  save_checkpoint: true
  save_state_data: true
  trajectory_format: "dcd"

force_field:
  protein: "ff14sb_off_impropers_0.0.4.offxml"
  small_molecule: "openff-2.3.0.offxml"
