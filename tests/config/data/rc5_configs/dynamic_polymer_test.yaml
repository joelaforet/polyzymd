# ============================================================================
# PolyzyMD Configuration: Dynamic Polymer Generation Test
# ============================================================================
# Minimal test configuration for validating the dynamic polymer generation
# feature. This config generates polymers on-the-fly from monomer SMILES
# using ATRP chemistry, then runs a short OpenMM simulation.
#
# Required: You must provide an enzyme PDB file at structures/enzyme.pdb
# Optional: Substrate can be omitted for minimal testing
# ============================================================================

name: "dynamic_polymer_test"
engine: "openmm"
description: "Minimal test of dynamic polymer generation with OpenMM"
solutes:

  # ============================================================================
  # Enzyme Configuration
  # ============================================================================
  # You need to provide an enzyme PDB file. Replace with your actual path.
  - type: protein
    name: "TestEnzyme"
    pdb_path: "structures/enzyme.pdb"
    description: "Test enzyme for dynamic polymer generation"
    force_field: ["ff14sb_off_impropers_0.0.4.offxml"]
    charges: {method: library}

  # ============================================================================
  # Substrate Configuration (Optional - comment out to skip)
  # ============================================================================
  # - type: small_molecule
  #   name: "TestSubstrate"
  #   sdf_path: "structures/substrate_docked.sdf"
  #   conformer_index: 0
  #   residue_name: "LIG"
  #   force_field: ["openff-2.3.0.offxml"]
  #   charges: {method: nagl, model: "openff-gnn-am1bcc-1.0.0.pt"}

  # ============================================================================
  # Polymer Configuration - DYNAMIC MODE
  # ============================================================================
  - type: polymer
    generation_mode: "dynamic"  # Key setting: build chains with mBuild from SMILES
    type_prefix: "SBMA-EGMA"
  
    # The chemistry of the Paper 1 chains: SBMA and EGMA (methoxy
    # tetra(ethylene glycol) methacrylate). Each monomer is its repeat unit as
    # it is in the chain, with '*' on the two atoms that bond to the
    # neighbouring units (the C=C of the methacrylate becomes a single bond).
    # The first '*' bonds toward the head of the chain, the second toward the
    # tail. The notebook docs/source/tutorials/star_sited_monomers.ipynb helps
    # you place them.
    monomers:
      - label: "A"
        probability: 0.7
        name: "SBMA"
        # Sulfobetaine methacrylate - zwitterionic monomer
        smiles: "[*]CC([*])(C)C(=O)OCC[N+](C)(C)CCCS(=O)(=O)[O-]"
        residue_name: "SBM"
      - label: "B"
        probability: 0.3
        name: "EGMA"
        smiles: "[*]CC([*])(C)C(=O)OCCOCCOCCOCCOC"
        residue_name: "EGM"
  
    # The cap of each chain end, drawn per chain from its options (the
    # probabilities of each end sum to 1; a fixed cap is one option with
    # probability 1.0). Here each end is a whole monomer that kept its C=C
    # double bond, bonded through its CH2 carbon: the chain ends of the Paper 1
    # chains (2 ends + 3 repeat units = a 5-mer). With residue_name a cap is
    # its own residue. The length counts both ends. A hydrogen cap is {label: "H", smiles: "[*][H]", probability: 1.0}.
    end_groups:
      head:
        - {label: "A", name: "SBMA", smiles: "[*]C=C(C)C(=O)OCC[N+](C)(C)CCCS(=O)(=O)[O-]", residue_name: "SBM", probability: 0.7}
        - {label: "B", name: "EGMA", smiles: "[*]C=C(C)C(=O)OCCOCCOCCOCCOC", residue_name: "EGM", probability: 0.3}
      tail:
        - {label: "A", name: "SBMA", smiles: "[*]C=C(C)C(=O)OCC[N+](C)(C)CCCS(=O)(=O)[O-]", residue_name: "SBM", probability: 0.7}
        - {label: "B", name: "EGMA", smiles: "[*]C=C(C)C(=O)OCCOCCOCCOCCOC", residue_name: "EGM", probability: 0.3}
  
    max_retries: 10  # Builds tried if a ring is pierced or atoms overlap
  
    # Short polymers for faster testing
    length: 5   # 5-mer chains: 2 ends + 3 repeat units
    count: 2    # Only 2 polymer chains
  
    # Cache directory for generated polymers
    cache_directory: ".polymer_cache"
  
    # Packing settings
    packing:
      padding: 2.0  # nm padding around solute
      tolerance: 2.0  # PACKMOL tolerance (Angstrom)
      # movebadrandom: true  # uncomment for dense/heterogeneous polymer systems
    force_field: ["openff-2.3.0.offxml"]
    charges: {method: nagl, model: "openff-gnn-am1bcc-1.0.0.pt"}

# ============================================================================
# Solvent Configuration
# ============================================================================
solvent:
  force_field: ["openff-2.3.0.offxml"]
  water:
    model: "tip3p"
  
  co_solvents: []  # No co-solvents for minimal test
  
  ions:
    neutralize: true
    nacl_concentration: 0.1  # 100 mM of NaCl pairs; neutralizing ions are added on top
  
  box:
    padding: 1.0  # Smaller padding for faster solvation
    shape: "cube"  # Cube is faster than rhombic dodecahedron
    target_density: 1.0
    tolerance: 2.0

# ============================================================================
# Thermodynamics
# ============================================================================
thermodynamics:
  temperature: 300.0  # K
  pressure: 1.0  # bar

# ============================================================================
# Simulation Phases - SHORT DURATIONS FOR TESTING
# ============================================================================
simulation_phases:
  equilibration_stages:
    - name: "test_equilibration"
      duration: 0.01  # 10 ps - very short for testing
      samples: 10
      ensemble: "NVT"
      temperature: 300.0
      time_step: 2.0
      thermostat: "LangevinMiddle"
      thermostat_timescale: 1.0
  
  production:
    ensemble: "NPT"
    duration: 0.1  # 100 ps - short for testing
    samples: 10
    checkpoint_interval: 60.0
    time_step: 2.0
    thermostat: "LangevinMiddle"
    thermostat_timescale: 1.0
    barostat: "MC"
    barostat_frequency: 25
  
# ============================================================================
# Output Configuration
# ============================================================================
output:
  projects_directory: "."
  scratch_directory: null  # Use projects_directory
  naming_template: "{enzyme}_{polymer_type}_dynamic_test_run{replicate}"
